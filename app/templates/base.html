<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PedidoFácil{% endblock %}</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.min.css"
        integrity="sha384-L1dWfspMTHU/ApYnFiMz2QID/PlP1xCW9visvBdbEkOLkSSWsP6ZJWhPw6apiXxU"
        crossorigin="anonymous">
</head>
<body>
  <header class="container">
    <nav>
      <ul><li><strong>PedidoFácil</strong></li></ul>
      {% set owner = request.session.get("owner") if request is defined else none %}
      <ul>
        <li><a href="/productos">Productos</a></li>
        {% if owner %}
        <li>{{ owner.name }}</li>
        <li>
          <form method="post" action="/logout">
            <button type="submit" class="secondary">Cerrar sesión</button>
          </form>
        </li>
        {% endif %}
      </ul>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
