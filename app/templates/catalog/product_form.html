{% extends "base.html" %}
{% block title %}Nuevo producto · PedidoFácil{% endblock %}
{% import "catalog/_fields.html" as fields with context %}
{% block content %}
<h1>Nuevo producto</h1>
<form method="post" action="/productos" novalidate>
  <label>
    Nombre
    <input name="name" value="{{ form.name }}" maxlength="100" required{{ fields.invalid("name") }}>
    {{ fields.error("name") }}
  </label>
  <label>
    Descripción corta (opcional)
    <input name="description" value="{{ form.description }}" maxlength="200"{{ fields.invalid("description") }}>
    {{ fields.error("description") }}
  </label>
  <label>
    Precio en pesos
    <input name="price" value="{{ form.price }}" inputmode="numeric" placeholder="45.000" required{{ fields.invalid("price") }}>
    {{ fields.error("price") }}
  </label>
  <label>
    <input type="checkbox" name="tracks_inventory" role="switch"{% if form.tracks_inventory %} checked{% endif %}>
    Controla inventario
  </label>
  <button type="submit">Guardar</button>
  <a href="/productos">Cancelar</a>
</form>
{% endblock %}
