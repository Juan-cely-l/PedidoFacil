name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Calidad y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Instalar uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Instalar dependencias (exactamente las de uv.lock, solo desde wheels)
        run: uv sync --locked --no-build

      - name: Lint (ruff)
        run: uv run --no-sync ruff check --output-format=github .

      - name: Formato (ruff)
        run: uv run --no-sync ruff format --check .

      - name: Tipos (mypy)
        run: uv run --no-sync mypy

      - name: Pruebas y cobertura (pytest)
        run: uv run --no-sync pytest --junitxml=reports/junit.xml --cov-report=xml:reports/coverage.xml

      - name: Caché de SonarQube
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Informativo, no bloqueante (decisión de PED-99) hasta que la línea base esté limpia. Este
      # paso vive en el job checks, que es verificación obligatoria: sin continue-on-error, una
      # avería de SonarCloud detenía la integración de un PR. El paso sigue apareciendo como
      # fallido en la interfaz, así que el problema queda visible sin impedir el trabajo.
      - name: Análisis de calidad (SonarQube Cloud)
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Guardar reportes como evidencia
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-${{ github.run_number }}
          path: reports/
          retention-days: 30

  deploy:
    name: Desplegar a producción
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Disparar el despliegue en Render
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "$DEPLOY_HOOK" > /dev/null

      - name: Verificar que producción corre este commit
        env:
          URL: ${{ vars.PRODUCTION_URL }}
          SHA: ${{ github.sha }}
        run: |
          expected="${SHA:0:7}"
          for i in $(seq 1 40); do
            commit=$(curl -fsS "$URL/health" | jq -r '.commit // ""' || true)
            if [ "$commit" = "$expected" ]; then echo "Producción corre $expected"; exit 0; fi
            echo "Intento $i: producción en '${commit:-sin respuesta}', se espera $expected"
            sleep 15
          done
          echo "El despliegue no terminó en 10 minutos"; exit 1
