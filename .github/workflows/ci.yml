name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Calidad y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Instalar dependencias (exactamente las de uv.lock)
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check --output-format=github .

      - name: Formato (ruff)
        run: uv run ruff format --check .

      - name: Tipos (mypy)
        run: uv run mypy

      - name: Pruebas y cobertura (pytest)
        run: uv run pytest --junitxml=reports/junit.xml --cov-report=xml:reports/coverage.xml

      - name: Guardar reportes como evidencia
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-${{ github.run_number }}
          path: reports/
          retention-days: 30
