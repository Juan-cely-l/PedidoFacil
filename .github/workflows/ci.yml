name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Calidad y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Instalar uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Instalar dependencias (exactamente las de uv.lock)
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run --no-sync ruff check --output-format=github .

      - name: Formato (ruff)
        run: uv run --no-sync ruff format --check .

      - name: Tipos (mypy)
        run: uv run --no-sync mypy

      - name: Pruebas y cobertura (pytest)
        run: uv run --no-sync pytest --junitxml=reports/junit.xml --cov-report=xml:reports/coverage.xml

      - name: Caché de SonarQube
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Análisis de calidad (SonarQube Cloud)
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Guardar reportes como evidencia
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-${{ github.run_number }}
          path: reports/
          retention-days: 30

  deploy:
    name: Desplegar a producción
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Disparar el despliegue en Render
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "$DEPLOY_HOOK" > /dev/null

      - name: Verificar que producción corre este commit
        env:
          URL: ${{ vars.PRODUCTION_URL }}
          SHA: ${{ github.sha }}
        run: |
          expected="${SHA:0:7}"
          for i in $(seq 1 40); do
            commit=$(curl -fsS "$URL/health" | jq -r '.commit // ""' || true)
            if [ "$commit" = "$expected" ]; then echo "Producción corre $expected"; exit 0; fi
            echo "Intento $i: producción en '${commit:-sin respuesta}', se espera $expected"
            sleep 15
          done
          echo "El despliegue no terminó en 10 minutos"; exit 1
