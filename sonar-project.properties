sonar.projectKey=Juan-cely-l_PedidoFacil
sonar.organization=juan-cely-l

# Sin sonar.sources ni sonar.tests: SonarCloud analiza todo el proyecto y los ignora («The new
# analysis scope UX analyzes the whole project by default»). El alcance real lo fija
# sonar.exclusions.
# Scripts de Spec Kit (.specify/): herramienta de especificación, no código del proyecto.
sonar.exclusions=.specify/**
sonar.python.version=3.12

sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.junit.reportPaths=reports/junit.xml
